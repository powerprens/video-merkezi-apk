name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Tuzak: setup-android varsayilan paketi (tools) yok, PATLAR.
      # Sadece platform-tools iste; platform + build-tools'u sdkmanager ile kur.
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Platform + build-tools kur
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true

      - name: Gradle 8.7 kur
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7

      - name: Debug APK derle
        run: gradle :app:assembleDebug --stacktrace

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: video-merkezi-apk
          path: app/build/outputs/apk/debug/app-debug.apk
